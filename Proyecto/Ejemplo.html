<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Dados</title>
    <link rel="icon" href="https://cdn.discordapp.com/attachments/1349310378705813555/1349347894062350366/favicon.ico?ex=67d36e67&is=67d21ce7&hm=b5e67652623806ddda9a870830396395de021bf64c0ff15402c86a265d285cf5&type=image/x-icon">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        /* Fondo de la página con imagen */
        body {
            background: url('https://media.istockphoto.com/id/108161789/es/foto/ruleta.jpg?s=1024x1024&w=is&k=20&c=hc-V1RGEbN0kM_X8bK9ggpJMwpx3lfYN8yPETcFNeGk=') no-repeat center center fixed; 
            background-size: cover; /* Hace que la imagen cubra toda la pantalla */
            background-position: center; /* Asegura que la imagen esté centrada */
            background-attachment: fixed; /* Fija la imagen de fondo al desplazarse */
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* Centra el contenido vertical y horizontalmente */
        }

        /* Estilos generales para el contenedor */
        .container-box {
            border: 5px solid #000000;
            padding: 30px;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.7); /* Fondo negro con transparencia para que se vea la imagen */
            color: #ffffff; /* Color del texto blanco */
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
            text-align: center; /* Asegura que todo el texto esté centrado */
        }

        h1 {
            font-family: 'Lobster', sans-serif;
            font-size: 72px;
            color: #ffffff;
            background: linear-gradient(135deg, #ff77a9, #ffb74d);
            -webkit-background-clip: text;
            background-clip: text;
            padding: 20px;
            border-radius: 15px;
            text-transform: uppercase;
            letter-spacing: 5px;
            white-space: nowrap;
            animation: roll 10s linear infinite, float 2s ease-in-out infinite;
        }

        /* Efecto roll (desplazamiento de lado a lado) */
        @keyframes roll {
            0% {
                transform: translateX(100%);
            }
            50% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* Efecto flotante (arriba y abajo) */
        @keyframes float {
            0% {
                transform: translateY(-20px);
            }
            50% {
                transform: translateY(20px);
            }
            100% {
                transform: translateY(-20px);
            }
        }

        .btn-custom {
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-custom:hover {
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .result-box {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        /* Estilo de los dados */
        .dado {
            width: 80px;
            height: 80px;
            background-color: rgb(242, 238, 238);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
        }

        .puntos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 15px;
        }

        .punto {
            width: 15px;
            height: 15px;
            background-color: black;
            border-radius: 50%;
            opacity: 0;
        }

        .punto-1 { grid-row: 2; grid-column: 2; opacity: 1; }
        .punto-2 { grid-row: 1; grid-column: 1; }
        .punto-3 { grid-row: 3; grid-column: 3; }
        .punto-4 { grid-row: 1; grid-column: 3; }
        .punto-5 { grid-row: 3; grid-column: 1; }
        .punto-6 { grid-row: 1; grid-column: 2; }
        .punto-7 { grid-row: 3; grid-column: 2; }
        .punto-8 { grid-row: 2; grid-column: 1; }
        .punto-9 { grid-row: 2; grid-column: 3; }

    </style>
</head>
<body>

    <div class="container-box mx-auto">
        <!-- Título centrado -->
        <h1 class="text-first"><strong>Rolls & Win</strong></h1>
        <h2 class="text-primary">🎲 Simulador de Dados 🎲</h2>

        <div class="row justify-content-center mt-4">
            <div class="col-md-5">
                <label for="cantidad" class="form-label">Cantidad de Dados:</label>
                <input type="number" id="cantidad" class="form-control text-center" value="1" min="1">
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-success btn-lg me-2 btn-custom" onclick="lanzarDados()">🎲 Lanzar Dados</button>
            <button class="btn btn-danger btn-lg btn-custom" onclick="limpiarHistorialUI()">🗑 Limpiar</button>
        </div>

        <h2 class="mt-4">Resultados:</h2>
        <div id="resultados" class="result-box"></div>
    </div>

    <script>
        function lanzarDados() {
            let cantidad = document.getElementById("cantidad").value;
            let resultadosDiv = document.getElementById("resultados");
            resultadosDiv.innerHTML = ""; // Limpiar resultados anteriores

            cantidad = parseInt(cantidad);

            if (cantidad < 1) {
                alert("⚠️ La cantidad de dados debe ser al menos 1.");
                return;
            }

            for (let i = 0; i < cantidad; i++) {
                let valorDado = Math.floor(Math.random() * 6) + 1;
                let dado = document.createElement("div");
                dado.classList.add("dado");

                let puntos = document.createElement("div");
                puntos.classList.add("puntos");

                // Crear los 9 puntos posibles
                for (let j = 1; j <= 9; j++) {
                    let punto = document.createElement("div");
                    punto.classList.add("punto", `punto-${j}`);
                    puntos.appendChild(punto);
                }

                // Mostrar solo los puntos correctos según el número obtenido
                switch (valorDado) {
                    case 1:
                        puntos.querySelector(".punto-1").style.opacity = "1";
                        break;
                    case 2:
                        puntos.querySelector(".punto-2").style.opacity = "1";
                        puntos.querySelector(".punto-3").style.opacity = "1";
                        break;
                    case 3:
                        puntos.querySelector(".punto-2").style.opacity = "1";
                        puntos.querySelector(".punto-1").style.opacity = "1";
                        puntos.querySelector(".punto-3").style.opacity = "1";
                        break;
                    case 4:
                        puntos.querySelector(".punto-2").style.opacity = "1";
                        puntos.querySelector(".punto-3").style.opacity = "1";
                        puntos.querySelector(".punto-4").style.opacity = "1";
                        puntos.querySelector(".punto-5").style.opacity = "1";
                        break;
                    case 5:
                        puntos.querySelector(".punto-2").style.opacity = "1";
                        puntos.querySelector(".punto-3").style.opacity = "1";
                        puntos.querySelector(".punto-4").style.opacity = "1";
                        puntos.querySelector(".punto-5").style.opacity = "1";
                        puntos.querySelector(".punto-1").style.opacity = "1";
                        break;
                    case 6:
                        puntos.querySelector(".punto-2").style.opacity = "1";
                        puntos.querySelector(".punto-3").style.opacity = "1";
                        puntos.querySelector(".punto-4").style.opacity = "1";
                        puntos.querySelector(".punto-5").style.opacity = "1";
                        puntos.querySelector(".punto-6").style.opacity = "1";
                        puntos.querySelector(".punto-7").style.opacity = "1";
                        break;
                }

                dado.appendChild(puntos);
                resultadosDiv.appendChild(dado);
            }
        }

        function limpiarHistorialUI() {
            document.getElementById("resultados").innerHTML = "";
        }
    </script>

</body>
</html>
