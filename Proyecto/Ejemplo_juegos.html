<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Dados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: url('https://media.istockphoto.com/id/108161789/es/foto/ruleta.jpg?s=1024x1024&w=is&k=20&c=hc-V1RGEbN0kM_X8bK9ggpJMwpx3lfYN8yPETcFNeGk=') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .sum-game {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 80%;
            max-width: 600px;
        }
        .progress {
            height: 25px;
            margin-top: 10px;
            transition: width 0.5s ease-in-out;
        }
        .dice-box {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .dado {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            align-items: center;
            justify-items: center;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
            font-size: 36px;
            font-weight: bold;
            padding: 10px;
        }
        .punto {
            width: 15px;
            height: 15px;
            background-color: black;
            border-radius: 50%;
            visibility: hidden;
        }
        .visible { visibility: visible; }

        /* Patrón de los dados */
        .cara-1 .punto:nth-child(5) { visibility: visible; }
        .cara-2 .punto:nth-child(1),
        .cara-2 .punto:nth-child(9) { visibility: visible; }
        .cara-3 .punto:nth-child(1),
        .cara-3 .punto:nth-child(5),
        .cara-3 .punto:nth-child(9) { visibility: visible; }
        .cara-4 .punto:nth-child(1),
        .cara-4 .punto:nth-child(3),
        .cara-4 .punto:nth-child(7),
        .cara-4 .punto:nth-child(9) { visibility: visible; }
        .cara-5 .punto:nth-child(1),
        .cara-5 .punto:nth-child(3),
        .cara-5 .punto:nth-child(5),
        .cara-5 .punto:nth-child(7),
        .cara-5 .punto:nth-child(9) { visibility: visible; }
        .cara-6 .punto:nth-child(1),
        .cara-6 .punto:nth-child(3),
        .cara-6 .punto:nth-child(4),
        .cara-6 .punto:nth-child(6),
        .cara-6 .punto:nth-child(7),
        .cara-6 .punto:nth-child(9) { visibility: visible; }

    </style>
</head>
<body>
    <div class="sum-game">
        <h3>Juego de la Suma</h3>
        <p>Lanza el dado y trata de alcanzar exactamente 15 puntos sin pasarte.</p>
        <div class="dice-box">
            <div id="dado-juego" class="dado">
                <div class="punto"></div><div class="punto"></div><div class="punto"></div>
                <div class="punto"></div><div class="punto"></div><div class="punto"></div>
                <div class="punto"></div><div class="punto"></div><div class="punto"></div>
            </div>
        </div>
        <p id="puntos-actuales">Puntos actuales: 0</p>
        <div class="progress">
            <div id="progress-bar" class="progress-bar bg-success" style="width: 0%;">0/15</div>
        </div>
        <button class="btn btn-warning mt-3" onclick="sumarPuntos()">🎲 Lanzar Dado</button>
        <p id="resultado-juego"></p>
    </div>
    <!-- Apartado debajo de los dados para Generala -->
<div class="mt-4">
    <h2 class="text-primary">🃏 Generala 🃏</h2>
    <p id="resultadoGenerala" class="fw-bold text-light">Lanza 5 dados y verifica tu jugada.</p>
    <button class="btn btn-warning btn-lg mt-2" onclick="verificarGenerala()">🔍 Verificar Generala</button>
</div>

<script>
    function verificarGenerala() {
        let dados = document.querySelectorAll(".dado");
        if (dados.length !== 5) {
            alert("⚠ Debes lanzar exactamente 5 dados para jugar Generala.");
            return;
        }

        let valores = [];
        dados.forEach(dado => {
            let puntosVisibles = Array.from(dado.querySelectorAll(".punto"))
                .filter(punto => punto.style.opacity === "1").length;
            valores.push(puntosVisibles);
        });

        valores.sort((a, b) => a - b);
        let resultado = "No hay combinación especial.";

        // Verificar combinaciones
        if (new Set(valores).size === 1) {
            resultado = "🎉 ¡Generala! (5 iguales)";
        } else if (valores.join('') === "12345" || valores.join('') === "23456") {
            resultado = "🃏 ¡Escalera!";
        } else if (valores[0] === valores[3] || valores[1] === valores[4]) {
            resultado = "🎲 ¡Poker! (4 iguales)";
        } else if ((valores[0] === valores[1] && valores[2] === valores[4]) || (valores[0] === valores[2] && valores[3] === valores[4])) {
            resultado = "🎭 ¡Full! (3 iguales + 2 iguales)";
        }

        document.getElementById("resultadoGenerala").textContent = resultado;
    }
</script>
    
    <script>
        let puntosJuego = 0;

        function sumarPuntos() {
            let dadoElemento = document.getElementById("dado-juego");
            let resultadoTexto = document.getElementById("resultado-juego");

            let valorDado = Math.floor(Math.random() * 6) + 1;

            // Quitar clases de cara previas y agregar la nueva
            dadoElemento.className = "dado cara-" + valorDado;

            puntosJuego += valorDado;

            document.getElementById("puntos-actuales").textContent = "Puntos actuales: " + puntosJuego;
            let porcentaje = (puntosJuego / 15) * 100;
            document.getElementById("progress-bar").style.width = Math.min(porcentaje, 100) + "%";
            document.getElementById("progress-bar").textContent = Math.min(puntosJuego, 15) + "/15";

            if (puntosJuego === 15) {
                resultadoTexto.innerHTML = "<strong class='text-success'>🎉 ¡Ganaste! Exactamente 15 puntos. 🎉</strong>";
            } else if (puntosJuego > 15) {
                resultadoTexto.innerHTML = "<strong class='text-danger'>😢 Te pasaste de 15 puntos. Inténtalo de nuevo.</strong>";
                setTimeout(resetJuego, 2000);
            }
        }

        function resetJuego() {
            puntosJuego = 0;
            document.getElementById("progress-bar").style.width = "0%";
            document.getElementById("progress-bar").textContent = "0/15";
            document.getElementById("puntos-actuales").textContent = "Puntos actuales: 0";
            document.getElementById("resultado-juego").innerHTML = "";
            document.getElementById("dado-juego").className = "dado";
        }
    </script>

    <!-- Apartado para Blackjack con Dados con hasta 4 jugadores -->
<div class="mt-4">
    <h2 class="text-primary">🃏 Blackjack con Dados 🎲</h2>
    <p id="resultadoBlackjack" class="fw-bold text-light">Máximo 4 jugadores. Cada uno intenta llegar a 21.</p>
    <label for="numJugadores" class="text-light">Número de jugadores:</label>
    <select id="numJugadores" class="form-select w-50 mx-auto">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>
    <button class="btn btn-success btn-lg mt-2" onclick="iniciarBlackjack()">🎲 Comenzar</button>
    <div id="jugadores" class="mt-3"></div>
</div>

<script>
    let jugadores = [];
    let turnoActual = 0;
    
    function iniciarBlackjack() {
        let numJugadores = parseInt(document.getElementById("numJugadores").value);
        jugadores = [];
        turnoActual = 0;
        let jugadoresDiv = document.getElementById("jugadores");
        jugadoresDiv.innerHTML = "";
        
        for (let i = 0; i < numJugadores; i++) {
            jugadores.push({ nombre: `Jugador ${i + 1}`, puntaje: lanzarDado() + lanzarDado(), plantado: false });
            let jugadorDiv = document.createElement("div");
            jugadorDiv.id = `jugador-${i}`;
            jugadorDiv.innerHTML = `<p class='text-light'><strong>${jugadores[i].nombre}</strong>: <span id='puntaje-${i}'>${jugadores[i].puntaje}</span> puntos</p>
            <button class='btn btn-primary btn-sm' onclick='pedirDado(${i})'>➕ Pedir</button>
            <button class='btn btn-danger btn-sm' onclick='plantarse(${i})'>✋ Plantarse</button>`;
            jugadoresDiv.appendChild(jugadorDiv);
        }
    }
    
    function pedirDado(jugador) {
        if (jugadores[jugador].plantado) return;
        let nuevoDado = lanzarDado();
        jugadores[jugador].puntaje += nuevoDado;
        document.getElementById(`puntaje-${jugador}`).textContent = jugadores[jugador].puntaje;
        if (jugadores[jugador].puntaje > 21) {
            document.getElementById(`jugador-${jugador}`).innerHTML += " <span class='text-danger'>💥 Eliminado</span>";
            jugadores[jugador].plantado = true;
        }
    }
    
    function plantarse(jugador) {
        jugadores[jugador].plantado = true;
        document.getElementById(`jugador-${jugador}`).innerHTML += " <span class='text-success'>✔️ Plantado</span>";
    }
    
    function lanzarDado() {
        return Math.floor(Math.random() * 6) + 1;
    }
</script>
</body>
</html>
